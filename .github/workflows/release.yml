# A release's stage, from its annotated tag v<version> on main
# (docs/releasing.md): the tag checked before anything builds; the five
# platform images built once for amd64 and arm64 with their attestations; the
# chart and the Compose archive packaged; the stack smoke (open-source mode),
# the install from the Compose archive and the packaged chart in kind, each on
# those exact bytes; only then the same bytes copied to the stage,
# ghcr.io/telflo/telflo-staging (digests kept), pulled back by digest, their
# digests recorded in digests.txt, and a draft GitHub Release made with the
# archive, create-secrets.sh, SHA256SUMS and digests.txt. The end-to-end tests
# run against the stage; .github/workflows/finalize.yml then copies the same
# bytes, by digest, to ghcr.io/telflo/telflo and publishes the Release.
#
# Every `run:` is tool setup, artifact handling or one call of a committed
# script (scripts/release/rehearse.sh runs the same scripts locally); values
# reach a script only through `env:`, never `${{ }}` inside `run:`. The
# three smokes run through steps.sh, their output through
# scripts/gates/redact.sh. scripts/release/check-workflows.sh holds these
# rules.
#
# There is no workflow_dispatch: a run that stopped part way is resumed with
# "Re-run failed jobs", which reuses this run's artifacts, so the bytes
# staged are still the bytes tested; a re-run skips what is already staged
# with the same digest and refuses anything else.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time, never canceled part way: two runs can't race
# between a publish's "is it there?" and its push. A newer run waiting for
# the group cancels an older waiting one (GitHub's rule): push one release
# tag at a time (docs/releasing.md).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Refused before anything builds: a tree in which gitleaks finds a secret
  # .gitleaksignore doesn't list; a tag that isn't v<x.y.z>, isn't
  # annotated, doesn't match charts/telflo/Chart.yaml at its commit, isn't
  # on main, or whose version is already published or staged; then the
  # collector artifacts the release points at must exist, and the default
  # collector's image is kept for the smokes. The full history (fetch-depth
  # 0) brings every tag; one the checkout holds as lightweight is asked of
  # GitHub's API with this job's read-only token.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
      collector_version: ${{ steps.collector.outputs.collector_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (tools.lock's, sha256-checked)
        run: bash scripts/release/tools.sh fetch gitleaks
      - name: The secret scan (gitleaks; .gitleaksignore lists the reviewed fakes)
        run: bash scripts/release/check-secrets.sh
      - name: crane (tools.lock's, sha256-checked)
        run: bash scripts/release/tools.sh fetch crane
      - name: Log in to GHCR (read; the private packages)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GH_TOKEN (this job's read-only token, this step only): if the checkout
      # holds the tag as a lightweight one, verify-tag.sh asks GitHub's API
      # whether it is annotated there, then unsets it before its registry
      # reads.
      - name: The tag
        id: tag
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          TAG: ${{ github.ref_name }}
          EXPECT: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/verify-tag.sh "$TAG" --expect "$EXPECT"
      - name: The collector images and chart exist
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: bash scripts/release/verify-collector-artifacts.sh
      - run: mkdir -p "$RUNNER_TEMP/collector"
      - name: The default collector's image, for the smokes
        id: collector
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: bash scripts/release/steps.sh collector-archive --out "$RUNNER_TEMP/collector"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-image
          path: ${{ runner.temp }}/collector/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  # The static gates on the tag's commit. The opamp-server's pin check reads
  # the public repository at the PIN's tag (0.3.0).
  static:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - run: bash scripts/release/steps.sh free-disk 8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.1
      - run: npm ci
        working-directory: telflo-core
      - run: bash scripts/release/tools.sh fetch crane
      - run: bash scripts/release/tools.sh fetch gitleaks
      - run: bash scripts/release/steps.sh pull-images
      - run: git clone --branch v0.3.0 https://github.com/telflo/opamp-server.git ../opamp-server
      - run: bash scripts/gates/static.sh --work "$RUNNER_TEMP/static"

  # One image per job, both processor types (arm64 under QEMU), from the
  # commit's files only, with SBOM and provenance attestations, into an OCI
  # archive kept as an artifact.
  build:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      matrix:
        image: [api, web, otelcol-validator, otelcol-testing, ottl-evaluator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - run: bash scripts/release/steps.sh free-disk 14
      - name: buildx (tools.lock's, sha256-checked) in a DOCKER_CONFIG of the job's
        run: bash scripts/release/tools.sh fetch buildx
      - run: bash scripts/release/tools.sh docker-config "$RUNNER_TEMP/docker"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: The builder (BuildKit at tools.lock's digest)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: bash scripts/release/steps.sh builder
      - run: mkdir -p "$RUNNER_TEMP/oci"
      - name: Build
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          IMAGE: ${{ matrix.image }}
        run: bash scripts/publish-platform-images.sh --build-oci "$RUNNER_TEMP/oci" --builder telflo-release --image "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/oci/${{ matrix.image }}.oci.tar
            ${{ runner.temp }}/oci/${{ matrix.image }}.digest
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  # The chart's package, the Compose archive, create-secrets.sh and
  # SHA256SUMS: the release's files, as one artifact.
  package:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.1
      - run: mkdir -p "$RUNNER_TEMP/release"
      - run: bash scripts/publish-chart.sh --chart telflo --package "$RUNNER_TEMP/release"
      - run: bash scripts/release/build-compose-archive.sh --out "$RUNNER_TEMP/release"
      - run: bash scripts/release/steps.sh release-files --out "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release/
          retention-days: 3
          if-no-files-found: error

  # The stack smoke in open-source mode on the amd64 images taken from the
  # archives: load-images.sh names linux/amd64, the runner's platform.
  stack-smoke:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - run: bash scripts/release/steps.sh free-disk 13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
        working-directory: telflo-core
      - run: npm run build -w @telflo/cli
        working-directory: telflo-core
      - run: bash scripts/release/tools.sh fetch crane
      - run: bash scripts/release/steps.sh pull-images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/oci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collector-image
          path: ${{ runner.temp }}/collector
      - name: The images into the engine (amd64)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/release/load-images.sh --oci "$RUNNER_TEMP/oci" --version "$VERSION" --platform linux/amd64
      - name: The default collector's image into the engine (amd64)
        env:
          COLLECTOR_VERSION: ${{ needs.version.outputs.collector_version }}
        run: bash scripts/release/load-images.sh --oci "$RUNNER_TEMP/collector" --version "$COLLECTOR_VERSION" --image collector --platform linux/amd64
      - name: The stack smoke (oss)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/release/steps.sh stack-smoke --version "$VERSION" --work "$RUNNER_TEMP/stack-smoke"

  # The Quick start from the Compose archive, as the README says;
  # its output through redact.sh (steps.sh archive-smoke).
  archive-smoke:
    needs: [version, build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - run: bash scripts/release/steps.sh free-disk 13
      - run: bash scripts/release/tools.sh fetch crane
      - run: bash scripts/release/steps.sh pull-images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/oci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collector-image
          path: ${{ runner.temp }}/collector
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/release/load-images.sh --oci "$RUNNER_TEMP/oci" --version "$VERSION" --platform linux/amd64
      - env:
          COLLECTOR_VERSION: ${{ needs.version.outputs.collector_version }}
        run: bash scripts/release/load-images.sh --oci "$RUNNER_TEMP/collector" --version "$COLLECTOR_VERSION" --image collector --platform linux/amd64
      - name: The archive smoke
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/release/steps.sh archive-smoke --version "$VERSION" --release "$RUNNER_TEMP/release" --work "$RUNNER_TEMP/archive-smoke"

  # The packaged chart installed into kind with the images loaded;
  # its output through redact.sh (steps.sh kind-smoke).
  kind-smoke:
    needs: [version, build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - run: bash scripts/release/steps.sh free-disk 18
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.1
      - run: npm ci
        working-directory: telflo-core
      - run: npm run build -w @telflo/cli
        working-directory: telflo-core
      - run: bash scripts/release/tools.sh fetch kind
      - run: bash scripts/release/tools.sh fetch crane
      - run: bash scripts/release/steps.sh pull-images --kind
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/oci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collector-image
          path: ${{ runner.temp }}/collector
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/release/load-images.sh --oci "$RUNNER_TEMP/oci" --version "$VERSION" --platform linux/amd64
      - env:
          COLLECTOR_VERSION: ${{ needs.version.outputs.collector_version }}
        run: bash scripts/release/load-images.sh --oci "$RUNNER_TEMP/collector" --version "$COLLECTOR_VERSION" --image collector --platform linux/amd64
      - name: The kind smoke
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/release/steps.sh kind-smoke --version "$VERSION" --release "$RUNNER_TEMP/release" --work "$RUNNER_TEMP/kind-smoke"

  # The stage, after every test job passed: the images and the chart to
  # ghcr.io/telflo/telflo-staging, never the public namespace, and a draft
  # Release. The `release` environment admits only v* tags and main (a
  # repository setting), and its reviewer approves this job. The only token
  # is this job's GITHUB_TOKEN; Docker's and Helm's logins go to files under
  # the runner's temporary folder, never the runner's home.
  publish:
    needs: [version, static, build, package, stack-smoke, archive-smoke, kind-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # the GitHub Release
      packages: write # the images and the chart, in GHCR
    env:
      # crane is tools.sh's checked one only.
      TELFLO_CRANE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - run: bash scripts/release/steps.sh free-disk 13
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.1
      - run: bash scripts/release/tools.sh fetch crane
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/oci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: Log in to GHCR (Docker and crane)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR (Helm)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm/registry/config.json
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/steps.sh helm-login
      - name: The images, to the stage (the archives' bytes, digests kept)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm/registry/config.json
        run: bash scripts/publish-platform-images.sh --push-oci "$RUNNER_TEMP/oci" --namespace telflo-staging
      - name: The chart, to the stage (the packaged file)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm/registry/config.json
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/publish-chart.sh --chart telflo --push-package "$RUNNER_TEMP/release/telflo-$VERSION.tgz" --namespace telflo-staging
      - name: The pull-back from the stage, by digest
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm/registry/config.json
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/release/pull-back.sh --oci "$RUNNER_TEMP/oci" --version "$VERSION" --chart "$RUNNER_TEMP/release/telflo-$VERSION.tgz" --namespace telflo-staging
      - name: The collector images and chart still exist
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm/registry/config.json
        run: bash scripts/release/verify-collector-artifacts.sh
      - name: The stage's record (digests.txt, what finalize copies)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm/registry/config.json
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/release/steps.sh digests --oci "$RUNNER_TEMP/oci" --version "$VERSION" --chart "$RUNNER_TEMP/release/telflo-$VERSION.tgz" --out "$RUNNER_TEMP/release/digests.txt"
      # The tag asked of GitHub's API once more first: still the annotated tag
      # of the commit the version job checked.
      - name: The draft GitHub Release (last)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm/registry/config.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: bash scripts/release/steps.sh github-release --draft --tag "$TAG" --commit "$COMMIT" --oci "$RUNNER_TEMP/oci" --release "$RUNNER_TEMP/release"
