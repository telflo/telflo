# CI: every pull request and every push to main. It holds no secret and
# writes nothing: every job reads the repository only (contents: read), and
# a pull request from a fork runs exactly as one from this repository, once a
# maintainer approves its first run. scripts/release/check-workflows.sh holds
# this file to its rules (ci.yml's own set: pinned actions, no credentials,
# the job list below).
#
# The jobs run in parallel; `ci` waits for all of them and is the one check
# main's branch protection requires, so adding or splitting a job never
# needs a settings change. On a pull request the browser tests run in
# Chromium; on main, in Chromium, Firefox and WebKit.
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A pull request's newer push cancels its older run; main's runs never
# cancel each other (each push is its own group).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The secret scan alone, so a leak (or a reviewed fake whose line moved,
  # which .gitleaksignore must follow) fails within a minute. static runs it
  # again with the other gates.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/release/tools.sh fetch gitleaks
      - run: bash scripts/release/check-secrets.sh

  # The static gates, exactly as the release's static job runs them
  # (scripts/gates/static.sh: the secret scan, naming, licenses, typecheck,
  # lint, the builds, both charts' render tests, the opamp-server's pin,
  # the gateway's log check and every script's self-test).
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/release/steps.sh free-disk 8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.1
      - run: npm ci
        working-directory: telflo-core
      - run: bash scripts/release/tools.sh fetch crane
      - run: bash scripts/release/tools.sh fetch gitleaks
      - run: bash scripts/release/steps.sh pull-images
      - run: git clone --branch v0.3.0 https://github.com/telflo/opamp-server.git ../opamp-server
      - run: bash scripts/gates/static.sh --work "$RUNNER_TEMP/static"

  # The unit and integration suites, in four parts, each against its own
  # Postgres and Mailpit. A part's coverage is below the thresholds by design
  # (vitest.config.ts skips them on a --shard run); each writes a blob report,
  # and unit-coverage joins the four and checks the thresholds on the whole.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
        env:
          POSTGRES_USER: telflo_platform_owner
          POSTGRES_PASSWORD: telflo-local
          POSTGRES_DB: telflo_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telflo_platform_owner -d telflo_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        ports: ["1025:1025", "8025:8025"]
    env:
      # The API's own login role, and the tables' owner. db:migrate and the
      # test setup provision the first with this CI-only password.
      TELFLO_DATABASE_URL: postgresql://telflo_platform:ci-only-api-password@localhost:5432/telflo_platform
      TELFLO_MIGRATION_DATABASE_URL: postgresql://telflo_platform_owner:telflo-local@localhost:5432/telflo_platform
      TELFLO_API_PORT: "8080"
      TELFLO_MAIL_TRANSPORT: smtp
      TELFLO_MAIL_FROM: no-reply@telflo.local
      TELFLO_SMTP_HOST: localhost
      TELFLO_SMTP_PORT: "1025"
      # The Mailpit service publishes its API on 8025, not the development
      # stack's 58025 that the integration tests default to.
      TELFLO_MAILPIT_API_URL: http://localhost:8025
      TELFLO_PUBLIC_WEB_URL: http://localhost:3000
      TELFLO_VERIFICATION_TOKEN_TTL_HOURS: "24"
      # CI only: the tests need a secret of 32 bytes or more.
      TELFLO_ACCESS_TOKEN_SECRET: ci-only-access-token-secret-not-for-production
      SHARD: ${{ matrix.shard }}
    defaults:
      run:
        working-directory: telflo-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 22: the web's unit tests fail under 24 (jsdom's AbortSignal
      # against Node's fetch), on main too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: telflo-core/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npx vitest run --coverage --maxWorkers=1 --minWorkers=1 --shard="$SHARD/4" --reporter=default --reporter=blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-blob-${{ matrix.shard }}
          path: telflo-core/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # The four parts' reports joined: one coverage report over the whole
  # suite, and the thresholds checked on it.
  unit-coverage:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: telflo-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: telflo-core/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-blob-*
          merge-multiple: true
          path: telflo-core/.vitest-reports/
      - run: npx vitest run --merge-reports --coverage

  # The browser tests, each browser in two parts. Playwright starts its own
  # API and web server against its own database, telflo_platform_e2e_test, on
  # the job's Postgres (playwright.config.ts). A pull request runs Chromium;
  # main runs all three browsers.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'push' && fromJSON('["chromium", "firefox", "webkit"]') || fromJSON('["chromium"]') }}
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
        env:
          POSTGRES_USER: telflo_platform_owner
          POSTGRES_PASSWORD: telflo-local
          POSTGRES_DB: telflo_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telflo_platform_owner -d telflo_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        ports: ["1025:1025", "8025:8025"]
    # As unit's. The browser tests' servers take only Postgres's and Mailpit's
    # addresses from here; playwright.config.ts sets the rest.
    env:
      TELFLO_DATABASE_URL: postgresql://telflo_platform:ci-only-api-password@localhost:5432/telflo_platform
      TELFLO_MIGRATION_DATABASE_URL: postgresql://telflo_platform_owner:telflo-local@localhost:5432/telflo_platform
      TELFLO_API_PORT: "8080"
      TELFLO_MAIL_TRANSPORT: smtp
      TELFLO_MAIL_FROM: no-reply@telflo.local
      TELFLO_SMTP_HOST: localhost
      TELFLO_SMTP_PORT: "1025"
      TELFLO_MAILPIT_API_URL: http://localhost:8025
      TELFLO_PUBLIC_WEB_URL: http://localhost:3000
      TELFLO_VERIFICATION_TOKEN_TTL_HOURS: "24"
      TELFLO_ACCESS_TOKEN_SECRET: ci-only-access-token-secret-not-for-production
      BROWSER: ${{ matrix.browser }}
      SHARD: ${{ matrix.shard }}
    defaults:
      run:
        working-directory: telflo-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: telflo-core/package-lock.json
      - run: npm ci
      # This job's browser only, and the full browser, never --only-shell:
      # e2e/support/analytics.ts uses the full Chromium channel.
      - run: npx playwright install --with-deps "$BROWSER"
      - run: npm run test:e2e -- --project="$BROWSER" --shard="$SHARD/2"
      # The specs that must run with nothing else running
      # (playwright.config.ts's *-exclusive projects), after the rest; a part
      # may hold none of them.
      - run: npm run test:e2e -- --project="$BROWSER-exclusive" --no-deps --shard="$SHARD/2" --pass-with-no-tests
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            telflo-core/playwright-report/
            telflo-core/test-results/
          retention-days: 14

  # The OTTL evaluator (services/ottl-evaluator), as its own repository
  # would test it: no Postgres and no npm. One test reads catalog/
  # (pkg/ottlassert's TestOTTLVersionIsTheCatalogueDefault).
  ottl-evaluator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # go.mod's `go` line is the toolchain: no go command may download a
      # newer one (docs/conventions/go.md).
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: services/ottl-evaluator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/ottl-evaluator/go.mod
          cache-dependency-path: services/ottl-evaluator/go.sum
      # go.mod and go.sum say exactly what the code imports, and every
      # downloaded module matches go.sum's hashes.
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # Every module or package the service ships must allow redistribution,
      # checked against the platform's own allowed list.
      - name: License guard
        run: ./scripts/check-licenses.sh
      - name: License guard self-test
        run: ./scripts/check-licenses.test.sh
      # -json, so the next step can see skips; a failing test's output is
      # printed here, since the report itself goes to a file.
      - name: Tests
        run: |
          status=0
          go test -race -count=1 -json ./... > test-report.json || status=$?
          if [ "$status" -ne 0 ]; then
            echo "go test failed; the output of each failing test and package:"
            jq -rs '
              (map(select(.Action == "fail") | [.Package, (.Test // "")])) as $failed
              | .[]
              | select(
                  (.Action == "output" and ([.Package, (.Test // "")] | IN($failed[])))
                  or .Action == "build-output")
              | .Output' test-report.json
          fi
          exit "$status"
      # No test may skip itself: CI runs every one. Only test-level skips
      # count: go test also reports a "skip" for every package without tests.
      - name: No skipped tests
        run: |
          skipped=$(jq -r 'select(.Action == "skip" and .Test != null) | "\(.Package) \(.Test)"' test-report.json)
          if [ -n "$skipped" ]; then
            echo "These tests were skipped; CI runs every test:"
            echo "$skipped"
            exit 1
          fi

  # The collector validator (services/otelcol-validator): its tests, then
  # its test image with every offered collector and the binary tests in it.
  otelcol-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/otelcol-validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/otelcol-validator/requirements.txt
            services/otelcol-validator/requirements-dev.txt
      # The hash-pinned locks, as the image installs them: wheels only,
      # nothing outside the lock.
      - name: Install the locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements.txt
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-dev.txt
      # Everything but the real collectors (pytest.ini deselects `binary`);
      # warnings are errors.
      - name: Tests
        run: python -m pytest -q
      # Every module or package the service ships must allow redistribution,
      # checked against the platform's own allowed list.
      - name: License guard
        run: ./scripts/check-licenses.sh
      - name: License guard self-test
        run: ./scripts/check-licenses.test.sh
      # The image holds every offered collector (about 400 MB each, unpacked),
      # twice while it builds.
      - run: bash scripts/release/steps.sh free-disk 14
        working-directory: .
      # The `test` target: the runtime image plus the development lock and the
      # tests, each collector checked against the catalog's sha256.
      - name: Build the test image with every offered collector
        working-directory: .
        run: |
          docker build --file services/otelcol-validator/Dockerfile --target test \
            --build-arg OTELCOL_VERSIONS=all --tag telflo-otelcol-validator-test .
          docker image ls telflo-otelcol-validator-test
      # The real-collector tests, inside the image, with no network.
      - name: Binary tests
        run: docker run --rm --network none telflo-otelcol-validator-test pytest -m binary -q

  # The collector tester (services/otelcol-testing), as the validator's job,
  # with kwok's tests too.
  otelcol-testing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/otelcol-testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/otelcol-testing/requirements.txt
            services/otelcol-testing/requirements-dev.txt
      - name: Install the locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements.txt
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-dev.txt
      # Everything but the real collectors and kwok (pytest.ini deselects
      # `binary` and `kwok`); warnings are errors.
      - name: Tests
        run: python -m pytest -q
      # Every module or package the service ships must allow redistribution,
      # checked against the platform's own allowed list.
      - name: License guard
        run: ./scripts/check-licenses.sh
      - name: License guard self-test
        run: ./scripts/check-licenses.test.sh
      - run: bash scripts/release/steps.sh free-disk 14
        working-directory: .
      # The `test` target, with every offered collector and kwok's binaries,
      # each checked against its sha256.
      - name: Build the test image with every offered collector
        working-directory: .
        run: |
          docker build --file services/otelcol-testing/Dockerfile --target test \
            --build-arg OTELCOL_VERSIONS=all --tag telflo-otelcol-testing-test .
          docker image ls telflo-otelcol-testing-test
      - name: Binary and kwok tests
        run: docker run --rm --network none telflo-otelcol-testing-test pytest -m "binary or kwok" -q

  # docker-compose.yml kept working: every image built from source, the
  # whole stack started from an empty database, a real registration through
  # the gateway, and the tester's and evaluator's containers locked down.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The validator's and tester's images bake only the catalog's default
      # collector here: their own jobs check every version.
      OTELCOL_VERSIONS: default
      # The URL the opamp-server hands collectors: the smoke's collectors run
      # on the compose network, where the development default
      # (host.docker.internal) doesn't resolve on Linux.
      OPAMP_SERVER_URL: http://opamp-server:51234/opamp/api/v1
      # The smoke in its saas mode, with the SaaS's site values (as
      # scripts/gates/smoke-env.sh sets them): its oss mode runs only on a
      # throwaway stack (scripts/gates/stack.sh), which the release's
      # stack-smoke job runs in both modes.
      TELFLO_SMOKE_SITE: saas
      TELFLO_REGISTRATION: open
      TELFLO_PLAYGROUND: "true"
      TELFLO_ANONYMOUS_VALIDATE: "true"
      TELFLO_PUBLIC_FLOWS: "true"
      TELFLO_TERMS_VERSION: "2026-01-01"
      TELFLO_TERMS_URL: /home/terms-of-service
      TELFLO_PRIVACY_URL: /home/privacy-policy
      TELFLO_SALES_INQUIRY: "true"
      TELFLO_SALES_INQUIRY_TO: sales@example.com
      TELFLO_EMAIL_NOTIFICATIONS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/release/steps.sh free-disk 13
      - name: Build and start the full stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Smoke-test through the gateway
        run: ./scripts/smoke-test-stack.sh
      # From inside the tester's container no external name resolves and no
      # external address answers, the root file system is read-only, and the
      # secret is in no environment.
      - name: The tester's container is locked down
        run: ./services/otelcol-testing/scripts/check-container.sh
      # The evaluator's `selfcheck` from inside its distroless container, then
      # its forwarder's lockdown.
      - name: The evaluator's container is locked down
        run: ./services/ottl-evaluator/scripts/check-container.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The one required check: it passes only when every job above passed (a
  # failed, canceled or skipped job fails it).
  ci:
    needs: [secrets, static, unit, unit-coverage, e2e, ottl-evaluator, otelcol-validator, otelcol-testing, stack]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Every job passed
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a job ended $result"; exit 1; }
          done
