# The release pipeline's private tools (D36-2 decision 110; Q281, Ruling 383,
# Preflight rulings 4 and 5), read by scripts/release/tools.sh. Nothing here is
# installed system-wide: tools.sh fetches each into the git-ignored .tools/ and
# checks it against the sha256 below before it may run; images are pulled by
# digest only. A runner installs the same versions with the same sums.
#
# tool <name> <version> <os-arch> <url> <sha256> <sums file> <member> <binary sha256>
#   <sha256> is the downloaded file's, as the project publishes it in
#   <sums file> (a file of that release); <member> is the one file taken from
#   a .tar.gz download ("-": the download is the binary itself); <binary
#   sha256> is that member's own sha256 ("-" when the download is the binary:
#   <sha256> is then the binary's), which `tools.sh path` checks the installed
#   binary against every time (Ruling 399). The binaries' sums were taken from
#   files `tools.sh fetch` had extracted from archives that matched <sha256>.
#   kind: each asset's own .sha256sum; crane: the release's checksums.txt
#   (crane only, from go-containerregistry's archive); buildx: checksums.txt
#   for Linux, checksums-signed.txt for macOS (its macOS binaries are signed
#   after the build, so checksums.txt's macOS lines don't match them);
#   gitleaks: the release's gitleaks_<version>_checksums.txt (gitleaks only,
#   from its archive; scripts/release/check-secrets.sh runs it).
tool kind v0.33.0 darwin-arm64 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-darwin-arm64 0c8c7dbe5e23594a198b786c4bc13dacc101fa6196b0cb0b23a1ca44e61f4b4f kind-darwin-arm64.sha256sum - -
