#
# image <key> <repository> <tag> <digest> <after>
#   pulled by `tools.sh pull <key>` as <repository>@<digest> only (the tag is
#   for people); <after> is `remove` (tools.sh remove deletes it when D36-2 is
#   done) or `keep` (it was on the machine before, for other work).
#   binfmt (QEMU's emulators) runs on the runner only, pinned by the workflow.
