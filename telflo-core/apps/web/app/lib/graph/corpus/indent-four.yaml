# Four-space indentation, sequences indented under their keys (Preflight ruling 1).
receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
    filelog:
        include:
            - /var/log/app/*.log
            - /var/log/sys/*.log
        start_at: end
processors:
    batch:
        timeout: 5s
exporters:
    debug:
        verbosity: basic
service:
    pipelines:
        logs:
            receivers:
                - filelog
                - otlp # the OTLP one
            processors: [batch]
            exporters:
                - debug
