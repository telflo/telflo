# Components and pipelines with no value.
receivers:
  otlp:
processors:
  batch: ~
exporters:
  debug:
connectors:
extensions:
  zpages:
service:
  extensions: [zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: []
      exporters: [debug]
    logs:
    metrics:
      receivers:
      exporters: [debug]
