# OpenTelemetry Collector Configuration
# Generated by Telflo

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 'localhost:4317'
      http:
        endpoint: 'localhost:4318'
  hostmetrics:
    collection_interval: '10s'
    initial_delay: '1s'
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
  filelog:
    include:
      - '/var/log/*.log'
    start_at: 'end'
    encoding: 'utf-8'
    poll_interval: '200ms'
    max_concurrent_files: 1024
    fingerprint_size: '1kb'
    max_log_size: '1MiB'
    force_flush_period: '500ms'
    include_file_name: true
processors:
  batch:
    timeout: '200ms'
    send_batch_size: 8192
    send_batch_max_size: 0
    metadata_keys: []
    metadata_cardinality_limit: 1000
  tail_sampling:
    decision_wait: '30s'
    num_traces: 50000
    expected_new_traces_per_sec: 0
    policies:
      - name: 'sample-errors'
        type: 'status_code'
        status_code:
          status_codes:
            - 'ERROR'
      - name: 'high-latency'
        type: 'latency'
        latency:
          threshold_ms: 1000
      - name: 'sample-10-percent'
        type: 'probabilistic'
        probabilistic:
          sampling_percentage: 10
  attributes:
    actions:
      - key: 'environment'
        action: 'insert'
        value: 'production'
      - key: 'db.password'
        action: 'delete'
  transform:
    error_mode: 'ignore'
    trace_statements:
      - context: 'resource'
        statements:
          - 'set(attributes["deployment.environment"], "production")'
    metric_statements: []
    log_statements: []
  memory_limiter:
    check_interval: '1s'
    limit_mib: 512
  resourcedetection:
    detectors:
      - 'env'
      - 'system'
    timeout: '5s'
    override: true
  filter/logs:
    error_mode: 'ignore'
    logs:
      log_record:
        - 'severity_number < SEVERITY_NUMBER_WARN'
  redaction:
    allow_all_keys: true
    blocked_values:
      - '\d{3}-\d{2}-\d{4}'
    summary: 'debug'
exporters:
  otlp:
    endpoint: 'otelcol:4317'
    timeout: '5s'
    compression: 'gzip'
    tls:
      insecure: false
      cert_file: '/certs/client.crt'
      key_file: '/certs/client.key'
      ca_file: '/certs/ca.crt'
  otlphttp:
    endpoint: 'http://localhost:4318'
    timeout: '30s'
    encoding: 'proto'
    compression: 'gzip'
connectors:
  spanmetrics:
    histogram:
      unit: 'ms'
      explicit:
        buckets:
          - '2ms'
          - '4ms'
          - '6ms'
          - '8ms'
          - '10ms'
          - '50ms'
          - '100ms'
          - '200ms'
          - '400ms'
          - '800ms'
          - '1s'
          - '1400ms'
          - '2s'
          - '5s'
          - '10s'
          - '15s'
    dimensions: []
    aggregation_temporality: 'CUMULATIVE'
extensions:
  health_check:
    endpoint: '0.0.0.0:13133'
    path: '/'
  pprof:
    endpoint: '0.0.0.0:1777'
  zpages:
    endpoint: '0.0.0.0:55679'
service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, tail_sampling, attributes, transform]
      exporters: [otlp, spanmetrics]
    metrics:
      receivers: [hostmetrics, spanmetrics]
      processors: [batch, memory_limiter, resourcedetection]
      exporters: [otlphttp]
    logs:
      receivers: [filelog]
      processors: [batch, filter/logs, redaction]
      exporters: [otlphttp]
