# OpenTelemetry Collector Configuration
# Generated by Telflo

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 'localhost:4317'
      http:
        endpoint: 'localhost:4318'
exporters:
  otlp:
    endpoint: 'otelcol:4317'
    timeout: '5s'
    compression: 'gzip'
    tls:
      insecure: true
connectors:
  routing:
    error_mode: 'ignore'
    default_pipelines:
      - 'traces/out'
    table:
      - context: 'resource'
        condition: 'attributes["deployment.environment"] == "prod"'
        action: 'copy'
        pipelines:
          - 'traces/out'
service:
  pipelines:
    traces/in:
      receivers: [otlp]
      exporters: [routing]
    traces/out:
      receivers: [routing]
      exporters: [otlp]
