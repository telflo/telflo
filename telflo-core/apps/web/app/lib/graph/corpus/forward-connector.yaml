# OpenTelemetry Collector Configuration
# Generated by Telflo

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 'localhost:4317'
      http:
        endpoint: 'localhost:4318'
exporters:
  otlp:
    endpoint: 'otelcol:4317'
    timeout: '5s'
    compression: 'gzip'
    tls:
      insecure: true
connectors:
  forward: {}
service:
  pipelines:
    logs/in:
      receivers: [otlp]
      exporters: [forward]
    logs/out:
      receivers: [forward]
      exporters: [otlp]
