# YAML 1.2 core numbers and dates.
receivers:
  otlp: {}
exporters:
  file:
    path: /tmp/out.json
    octal: 0o17
    hex: 0x1F
    leading_zero: 0750
    big: 12345678901234567890
    exponent: 1e3
    date: 2024-01-01
    yes_is_text: yes
service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [file]
