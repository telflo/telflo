# OpenTelemetry Collector Configuration
# Generated by Telflo

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 'localhost:4317'
      http:
        endpoint: 'localhost:4318'
processors:
  batch:
    timeout: '200ms'
    send_batch_size: 8192
    send_batch_max_size: 0
    metadata_keys: []
    metadata_cardinality_limit: 1000
  transform:
    error_mode: 'propagate'
    trace_statements: []
    metric_statements: []
    log_statements: []
exporters:
  otlp:
    endpoint: 'otelcol:4317'
    timeout: '5s'
    compression: 'gzip'
    tls:
      insecure: true
  otlphttp:
    endpoint: 'http://localhost:4318'
    timeout: '30s'
    encoding: 'proto'
    compression: 'gzip'
connectors:
  failover:
    priority_levels:
      - - 'metrics/primary'
      - - 'metrics/secondary'
    retry_interval: '30s'
service:
  pipelines:
    metrics/in:
      receivers: [otlp]
      exporters: [failover]
    metrics/primary:
      receivers: [failover]
      processors: [batch, transform]
      exporters: [otlp]
    metrics/secondary:
      receivers: [failover]
      exporters: [otlphttp]
