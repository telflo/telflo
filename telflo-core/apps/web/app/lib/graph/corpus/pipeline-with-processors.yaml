# OpenTelemetry Collector Configuration
# Generated by Telflo

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 'localhost:4317'
      http:
        endpoint: 'localhost:4318'
processors:
  memory_limiter:
    check_interval: '1s'
    limit_mib: 512
  batch:
    timeout: '200ms'
    send_batch_size: 8192
    send_batch_max_size: 0
    metadata_keys: []
    metadata_cardinality_limit: 1000
exporters:
  otlphttp:
    endpoint: 'http://localhost:4318'
    timeout: '30s'
    encoding: 'proto'
    compression: 'gzip'
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp]
