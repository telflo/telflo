# Decision 3: a connector in a pipeline with no processors keeps its place,
# even where the pipeline has nothing else on that side to join it to.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
exporters:
  debug:
    verbosity: basic
connectors:
  forward:
  forward/fanout: {}
  spanmetrics:
    dimensions: []
service:
  pipelines:
    traces/in:
      receivers: [otlp]
      exporters: [forward]
    traces/bridge:
      receivers: [forward]
      exporters: [spanmetrics, forward/fanout]
    metrics:
      receivers: [spanmetrics]
      exporters: [debug]
    traces/building:
      receivers: [forward/fanout]
    logs:
      receivers: [otlp]
      exporters: [forward/logs]
