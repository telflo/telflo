<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 80" width="190" height="80">
  <defs>
    <linearGradient id="traceGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#06B6D4" />
      <stop offset="100%" style="stop-color:#0EA5E9" />
    </linearGradient>
    <linearGradient id="metricGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#0EA5E9" />
      <stop offset="100%" style="stop-color:#3B82F6" />
    </linearGradient>
    <linearGradient id="logGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#3B82F6" />
      <stop offset="100%" style="stop-color:#6366F1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#06B6D4" />
      <stop offset="100%" style="stop-color:#6366F1" />
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(0, 0)">
    <!-- Traces - top line -->
    <path
      d="M12 28 Q27 12, 40 28 Q53 44, 68 28"
      stroke="url(#traceGrad)"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Metrics - middle line -->
    <path
      d="M12 40 Q27 24, 40 40 Q53 56, 68 40"
      stroke="url(#metricGrad)"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Logs - bottom line -->
    <path
      d="M12 52 Q27 36, 40 52 Q53 68, 68 52"
      stroke="url(#logGrad)"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Wordmark -->
  <text
    x="82"
    y="52"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="600"
    font-size="40"
    fill="#0F172A"
    letter-spacing="-1"
  >telflo</text>
</svg>
