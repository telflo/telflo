[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = tests
python_classes = Test*Case
# Warnings fail the run (as the validator's).
filterwarnings =
    error
markers =
    binary: runs a real otelcol-contrib from OTELCOL_BINARY_DIR; deselected by default, run inside the image with `pytest -m binary`
    kwok: starts kwok's fake Kubernetes cluster from the image's binaries; deselected by default, run inside the image with `pytest -m kwok`
addopts = --strict-markers -m "not binary and not kwok"
