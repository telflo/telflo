# kwokctl's configuration for the tester's fake Kubernetes cluster, passed
# as `kwokctl -c <this file>` on every call (app/kwok_cluster.py). It is
# configuration only: kwok's own code is never touched. Without it, kwokctl
# 0.7.0 defaults to Kubernetes v1.33.0 and, with no route out, retries a
# kubectl download forever; kube-apiserver exits with "no default routes
# found"; and etcd listens on every address.
#
# - kubeVersion: the version whose binaries the image bakes;
# - bindAddress: every component listens on 127.0.0.1 only;
# - the four binaries kwokctl starts or calls, all under /opt/kwok/v0.7.0/
#   (the image's layout, each checked against its sha256);
# - kube-apiserver's advertise-address, so it needs no default route.
kind: KwokctlConfiguration
apiVersion: config.kwok.x-k8s.io/v1alpha1
options:
  kubeVersion: v1.31.6
  bindAddress: 127.0.0.1
  kubectlBinary: /opt/kwok/v0.7.0/kubectl
  kubeApiserverBinary: /opt/kwok/v0.7.0/kube-apiserver
  etcdBinary: /opt/kwok/v0.7.0/etcd
  kwokControllerBinary: /opt/kwok/v0.7.0/kwok
componentsPatches:
  - name: kube-apiserver
    extraArgs:
      - key: advertise-address
        value: 127.0.0.1
