# ottl-evaluator-forward, a copy of the collector tester's
# (docker/otelcol-testing/forward.conf): the OTTL evaluator sits only on its
# own internal network, where Docker publishes no port, so this forwarder,
# on that network and the default one, passes TCP through to it for the API
# run natively in development and for the smoke test. Compose publishes it
# on the host's 127.0.0.1 only. The API in compose calls the evaluator
# directly, never through here.
#
# A stream (TCP) proxy, not HTTP: it reads nothing of a request, the Bearer
# secret included. The evaluator's name is resolved by Docker's DNS at each
# connection (`resolver` with a variable upstream), not once at start, so the
# forwarder starts before the evaluator and follows it across restarts.
# proxy_timeout's default (10 minutes without a byte either way) is far above
# an evaluation's longest silence (a 5 s wait for a slot and the 25 s limit).
events {}

stream {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 8003;
        set $t ottl-evaluator:8003;
        proxy_pass $t;
    }
}
