# The stack's single entry point (ADR 0017). The browser only ever talks to
# this origin: /api/ goes to the API, everything else to the web app. That
# is what lets the web image call the API with relative URLs, so one built
# image works at any hostname a customer installs it under.

# A quick-deploy link's secret (D17c-2 decisions 2 and 28, Preflight ruling
# 12) never reaches nginx's access log. Its request field is
# $telflo_logged_request: the request line, but "METHOD
# /api/v1/quick-deploy/[redacted] PROTOCOL" for any request whose path,
# decoded and normalised as nginx routes it ($uri: escapes decoded, "//"
# merged, "." and ".." resolved), holds /quick-deploy/ (or ends in
# /quick-deploy) or tqd_, or whose raw request line, query included, holds
# tqd_ with any of its characters percent-encoded or not (%74qd_, t%71d_,
# tqd%5F), case aside. The links' own routes (/quick-deploy-links) are
# logged as before. Its referer field is $telflo_logged_referer: the Referer,
# but "[redacted]" for one that holds /quick-deploy/ (or an encoded slash
# after it, or ends in it) or the same tqd_: a web page whose address holds
# a pasted secret refers to it when it loads its assets, and so would a
# page anyone opened from a link (a link typed without /api/ is nginx's own
# 404, below, and loads nothing). Nothing else in the format holds a URL.
# No Referer is logged "-", as the image's `main` logs it (a map's value is
# never "not found", which is what makes nginx log "-"); so is an
# empty one sent ("Referer:" with no value), which `main` logs "".
#
# An API token (D22 decision 40) never reaches it either: a request whose
# raw request line holds tf_, any of its characters percent-encoded once or
# not (%74f_, t%66_, tf%5F), case aside, is logged "METHOD /[redacted]
# PROTOCOL" (the quick-deploy line when it holds both); a Referer holding
# the same, "[redacted]". A token travels in the Authorization header, and
# no field of the format is derived from it: the user field is a fixed "-",
# never $remote_user, which nginx fills from an "Authorization: Basic"
# header's user name (a token sent as one, `curl -u "tf_…:"`, would be
# logged whole; nothing here uses Basic). These cover one pasted into a
# URL. Every other field holding a client's text holds none either (Ruling
# 105: no logged field holding a client-supplied value carries a tf_
# token): a User-Agent or an X-Forwarded-For holding tf_ in the same
# spellings is logged "[redacted]", an absent or empty one "-" (as the
# Referer). The format's other fields are nginx's own: the socket's
# address, the time, the status, the byte count. False positives (an
# asset's name holding tf_) only lose a log line's URL, or a field. No
# routing changes: nginx's error log keeps a token pasted into a query,
# a Referer or the Host header when an upstream fails, a residue as the
# quick-deploy one in another path's query, except under /api/public/v1
# (its locations log crit, below).
#
# A library link (D23-2 decisions 4, 47 and 50, Preflight ruling 16) never
# reaches it either, by the quick-deploy secret's rules: a request whose
# path as nginx routes it holds /library-links/ (or ends in /library-links)
# or tll_, or whose raw request line holds tll_ with any of its characters
# percent-encoded or not (%74ll_, t%6cl_, tl%6C_, tll%5F), case aside, is
# logged "METHOD /api/v1/library-links/[redacted] PROTOCOL" (the
# quick-deploy line when it holds a tqd_ too); a Referer holding the same,
# or /library-links/, "[redacted]"; a User-Agent or an X-Forwarded-For
# holding tll_, "[redacted]" (Ruling 128's class rule). The library's own
# routes (/api/v1/library-files..., the web's /library) are logged as
# before.
#
# The public surface (D25 decision 46, Ruling 177, the gateway's twin of
# the API's Ruling 173): any request under /api/public/v1 is logged as the
# fixed "METHOD /api/public/v1/[redacted] PROTOCOL", its path and query
# never: route 14's path holds a validation pipeline's NAME (configuration
# text, Ruling 167), and a client may append any query. Under it means: its
# path as nginx routes it ($uri: escapes decoded once, "//" merged, dot
# segments resolved; an absolute-form request line's path too) begins
# /api/public/v1, case aside; or its raw request line holds the prefix's
# three words, a slash (or an encoded one) before each, with any of their
# characters percent-encoded, once or more (%61, %2561...), case aside,
# and any path between them (runs of slashes, dot segments, encoded or
# doubly encoded ones: a spelling nginx decodes only once, which the API
# decodes again, Ruling 184). A quick-deploy or library-link line wins
# over it; it wins over the tf_ line. False positives (another path naming
# the three words) only lose a line's URL. Its Referer, User-Agent and
# X-Forwarded-For are logged by the rules above. Its ERROR log: the public
# locations below log crit and worse only (Ruling 184), so neither an
# upstream's failure nor a body over the limit quotes a public request
# line there.
#
# Product administration (D29 decision 41, Preflight ruling 9, Ruling
# 257): a product admin's requests carry other people's personal data in
# their query (the Users search's q: an email or an organization's name),
# so any request whose path as nginx routes it ($uri: escapes decoded once,
# "//" merged, dot segments resolved) begins /api/v1/product-admin, case
# aside, is logged as "METHOD $uri PROTOCOL": its path, never its query
# (the API's request log drops it too, by route and by path). Its path
# holds ids only. A quick-deploy, library-link, public or tf_ line wins
# over it, so a secret in such a path is still redacted whole. Its ERROR
# log: the product-admin location below logs crit and worse only, so an
# upstream's failure doesn't quote the request line, query included. That
# location is case-sensitive, as are the API's router and the /api/ prefix:
# a path in another case (/api/v1/PRODUCT-ADMIN/..., /API/V1/...) still
# drops its query from the access log (the map is case-insensitive), but its
# upstream's error log isn't limited to crit (Ruling 259's residue: the
# sender's own text, on a path no client uses).
#
# An organization's fleets, its configurations list and the open flow read
# (D36-1 decision 41, Preflight ruling 10), by product administration's
# rule. Any request whose path as nginx routes it ($uri, as above), case
# aside, is under /api/v1/organizations/<id>/fleets (a search's q, a fleet's
# label, a group's or a collector's name, and a cursor sorted by name, the
# base64url of one, travel in its query) or is the configurations list's,
# /api/v1/organizations/<id>/configurations with a trailing slash or
# without (its q is the search text), is logged "METHOD $uri PROTOCOL", its
# path, never its query (the API's request log drops them too). A request
# under /api/v1/published-flows is logged as the API's request log logs it
# (http/request-log.ts), by pattern: "METHOD /api/v1/published-flows
# PROTOCOL" for the list (its path, slashes after it or not), "METHOD
# /api/v1/published-flows/:slug PROTOCOL" for anything after it (a slash, a
# ";", a "?" or "#" decoded from the path, or any of them percent-encoded,
# once or more): never a slug as sent, never a query.
# /api/v1/published-flowsx is a lookalike, logged as sent. A quick-deploy,
# library-link, public or tf_ line wins over each, as over product
# administration's. Their ERROR log: the fleets and published-flows
# locations below, and the configurations list's (the create's 5 MiB), log
# crit and worse only, as product administration's: an upstream's failure,
# or a body over a limit, would quote the request line, query and all.
# Case-sensitive locations, as product administration's: a path in another
# case drops its query (or its slug) from the access log, but its
# upstream's error log isn't limited to crit (Ruling 259's residue). An
# encoded slash inside the organization's segment (organizations/a%2Fb/
# fleets) decodes to one more segment, misses [^/]+ and keeps its query: a
# residue (D36-1 Ruling 343), since no organization's id holds a slash and
# the API answers it 400.
# scripts/check-gateway-logs.sh runs this file in the real image.
map $uri $telflo_quick_deploy_uri {
    "~*/quick-deploy(/|$)"  1;
    "~*tqd_"                1;
    default                 0;
}
map $request $telflo_quick_deploy {
    "~*(t|%74|%54)(q|%71|%51)(d|%64|%44)(_|%5f)"  1;
    default                 $telflo_quick_deploy_uri;
}
map $uri $telflo_library_link_uri {
    "~*/library-links(/|$)"  1;
    "~*tll_"                 1;
    default                  0;
}
map $request $telflo_library_link {
    "~*(t|%74|%54)(l|%6c|%4c)(l|%6c|%4c)(_|%5f)"  1;
    default                 $telflo_library_link_uri;
}
map $uri $telflo_public_api_uri {
    "~*^/api/public/v1"     1;
    default                 0;
}
map $request $telflo_public_api {
    "~*(/|%(25)*2f)(a|%(25)*[46]1)(p|%(25)*[57]0)(i|%(25)*[46]9)(/|%(25)*2f)([^ ?]*(/|%(25)*2f))?(p|%(25)*[57]0)(u|%(25)*[57]5)(b|%(25)*[46]2)(l|%(25)*[46]c)(i|%(25)*[46]9)(c|%(25)*[46]3)(/|%(25)*2f)([^ ?]*(/|%(25)*2f))?(v|%(25)*[57]6)(1|%(25)*31)"  1;
    default                 $telflo_public_api_uri;
}
map $request $telflo_api_token {
    "~*(t|%74|%54)(f|%66|%46)(_|%5f)"  1;
    default                 0;
}
map $uri $telflo_query_dropped {
    "~*^/api/v1/product-admin(/|$)"                     1;
    "~*^/api/v1/organizations/[^/]+/fleets(/|$)"        1;
    "~*^/api/v1/organizations/[^/]+/configurations/?$"  1;
    default                 0;
}
map $uri $telflo_published_flow {
    "~*^/api/v1/published-flows/*$"                              "/api/v1/published-flows";
    "~*^/api/v1/published-flows([/;?#]|%(25)*(2f|3b|3f|23))"    "/api/v1/published-flows/:slug";
    default                 "";
}
map "$telflo_quick_deploy$telflo_library_link$telflo_public_api$telflo_api_token$telflo_query_dropped$telflo_published_flow" $telflo_logged_request {
    "~^1"                   "$request_method /api/v1/quick-deploy/[redacted] $server_protocol";
    "~^01"                  "$request_method /api/v1/library-links/[redacted] $server_protocol";
    "~^001"                 "$request_method /api/public/v1/[redacted] $server_protocol";
    "~^0001"                "$request_method /[redacted] $server_protocol";
    "~^00001"               "$request_method $uri $server_protocol";
    "~^00000(?<telflo_flow_pattern>/.+)$"  "$request_method $telflo_flow_pattern $server_protocol";
    default                 $request;
}
map $http_referer $telflo_logged_referer {
    ""                      "-";
    "~*/quick-deploy(/|%2f|$)"                    "[redacted]";
    "~*(t|%74|%54)(q|%71|%51)(d|%64|%44)(_|%5f)"  "[redacted]";
    "~*/library-links(/|%2f|$)"                   "[redacted]";
    "~*(t|%74|%54)(l|%6c|%4c)(l|%6c|%4c)(_|%5f)"  "[redacted]";
    "~*(t|%74|%54)(f|%66|%46)(_|%5f)"             "[redacted]";
    default                 $http_referer;
}
map $http_user_agent $telflo_logged_user_agent {
    ""                      "-";
    "~*(t|%74|%54)(l|%6c|%4c)(l|%6c|%4c)(_|%5f)"  "[redacted]";
    "~*(t|%74|%54)(f|%66|%46)(_|%5f)"             "[redacted]";
    default                 $http_user_agent;
}
map $http_x_forwarded_for $telflo_logged_forwarded_for {
    ""                      "-";
    "~*(t|%74|%54)(l|%6c|%4c)(l|%6c|%4c)(_|%5f)"  "[redacted]";
    "~*(t|%74|%54)(f|%66|%46)(_|%5f)"             "[redacted]";
    default                 $http_x_forwarded_for;
}
# The image's `main` format (/etc/nginx/nginx.conf) but for the request,
# referer, user agent and X-Forwarded-For fields, and the user field, a
# fixed "-" (above: no field is derived from the Authorization header).
log_format telflo '$remote_addr - - [$time_local] "$telflo_logged_request" '
                  '$status $body_bytes_sent "$telflo_logged_referer" '
                  '"$telflo_logged_user_agent" "$telflo_logged_forwarded_for"';

upstream telflo_platform { server telflo-api:8080; }
upstream telflo_web { server telflo-web:3000; }

server {
    listen 80;

    # The image's own access log, in the format above.
    access_log /var/log/nginx/access.log telflo;

    # Matches the API's own bodyLimit (1 MiB); larger bodies are refused
    # here rather than streamed to the API only to be refused there. The
    # routes with a larger limit get their own location below.
    client_max_body_size 1m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # gateway.extraRoutes (D36-1 decision 24, Preflight ruling 15): the
    # chart renders the list as `location = <path>` and `location ^~ <path>`
    # blocks into this file (empty when the list is; the compose stack
    # mounts docker/gateway/extra-routes.conf, comments only). An exact or a
    # ^~ prefix location wins over every regular expression below, so each
    # block logs crit and worse itself; the access log's maps are the
    # server's and cover them. An exact path, never a pattern: a missing
    # file stops nginx.
    include /etc/nginx/telflo/extra-routes.conf;

    # The public download (D17c-2 decision 28, Preflight ruling 12): nginx's
    # error log quotes the request line and the upstream's URL when the API
    # can't be reached, and its format can't be changed, so this location
    # logs only crit and worse (an upstream's failure is error): nginx's own
    # diagnostics of the route are given up (the access log keeps its
    # redacted line and status; the API logs its own). The first of the
    # regular expressions, so it wins for every spelling of a path that
    # holds a secret; the ^/api/ anchor keeps a web asset whose name holds
    # tqd_ out of the API.
    location ~* ^/api/.*(/quick-deploy(/|$)|tqd_) {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_platform;
    }

    # The library link's route (D23-2 decisions 45 and 50, Preflight ruling
    # 16), as the public download's above and for the same reason: crit and
    # worse only. Right after quick-deploy's (the order is binding: measured,
    # a later place leaks a link into the error log with the API down), so
    # it wins for every spelling of an API path holding a link.
    location ~* ^/api/.*(/library-links(/|$)|tll_) {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_platform;
    }

    # The same path typed without /api/ (D17c-2 decision 28, Ruling 44): a
    # /quick-deploy segment, or a path ending in /quick-deploy, in any
    # spelling nginx routes ($uri: case aside, escapes decoded, "//"
    # merged, dot segments resolved), outside ^/api/, is answered here, a
    # plain 404, and never proxied: the web app's server logs each request's
    # URL whole (react-router-serve's request log), so it never sees one.
    # The access log keeps its redacted line; the error log only crit, as
    # above. Plain text whatever the path's extension (types emptied).
    location ~* /quick-deploy(/|$) {
        error_log /var/log/nginx/error.log crit;
        types { }
        default_type text/plain;
        return 404 "Not found.";
    }

    # A library link's path typed without /api/ (D23-2 decision 50), as the
    # quick-deploy one above: nginx's plain 404, never proxied to the web
    # app (whose request log holds each URL whole), crit only.
    location ~* /library-links(/|$) {
        error_log /var/log/nginx/error.log crit;
        types { }
        default_type text/plain;
        return 404 "Not found.";
    }

    # A tqd_ elsewhere in a web path (an asset's name may hold one) goes to
    # the web app as before, never refused, with the same error log: the
    # web app down, nginx would quote it otherwise. A residue: the web app's
    # request log holds such a URL whole, as it does a secret pasted into a
    # web page's query.
    location ~* tqd_ {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_web;
    }

    # A tll_ elsewhere in a web path (D23-2 decision 50), as tqd_ above: to
    # the web app, crit only.
    location ~* tll_ {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_web;
    }

    # Product administration (D29 decision 41, Ruling 257): to the API as
    # location /api/ sends it (the server's 1 MiB and proxy headers), its
    # error log crit and worse only, as the secret locations above: nginx's
    # error log quotes the request line, the Users search's query (another
    # person's email) with it, when the API can't be reached. After the four
    # secret locations (Ruling 258), so a quick-deploy or library-link path,
    # or one holding tqd_ or tll_, keeps their rules; no later regular
    # expression matches a path under it (the size locations are other
    # paths; the public surface's needs its three words, which a
    # product-admin path holding them would meet here with the same crit
    # log and limit). Case-sensitive, as the API's router and location
    # /api/ are: another case is the API's 404, logged by the access log's
    # rule above without its query.
    location ~ ^/api/v1/product-admin(/|$) {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_platform;
    }

    # An organization's fleets and the open flow read (D36-1 decision 41,
    # Preflight ruling 10), as product administration's above: to the API as
    # location /api/ sends it, crit and worse only, so an upstream's failure
    # doesn't quote a fleets query or a flow's slug. After the four secret
    # locations, so a quick-deploy path under a fleet keeps their rules; no
    # size location below matches a path under either. The published-flows
    # location takes every spelling its access-log line does (above) but
    # another case; quoted, since it holds ";" and "#".
    location ~ ^/api/v1/organizations/[^/]+/fleets(/|$) {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_platform;
    }

    location ~ "^/api/v1/published-flows([/;?#]|%(25)*(2[fF]|3[bBfF]|23)|$)" {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_platform;
    }

    location /api/ {
        proxy_pass http://telflo_platform;
    }

    # Saving a configuration version (PATCH .../versions/:versionId) and
    # creating one (POST .../versions): 5 MiB, the routes' own bodyLimit (D9a
    # decision 6, D10 decision 4). The body carries the YAML, 262,144
    # characters, up to 1.5 MiB once JSON escapes them (D8 decision 7), and
    # the builder's graph, three columns of at most 1 MiB of JSON each: about
    # 4.4 MiB at most. The version's read (GET .../versions/:versionId) and
    # the versions' list (GET .../versions, D17b-1 decision 31) match too
    # and have no body; the rename (.../label) and the selection
    # (.../selected-version) don't, and keep 1 MiB. A regular expression, so
    # it wins over the /api/ prefix; the proxy headers are the server's, as
    # for /api/.
    location ~ ^/api/v1/organizations/[^/]+/configurations/[^/]+/versions(/[^/]+)?$ {
        client_max_body_size 5m;
        proxy_pass http://telflo_platform;
    }

    # Creating a configuration (POST /api/v1/organizations/:organizationId/
    # configurations): 5 MiB, the route's own bodyLimit, the versions'. A
    # create from a flow carries version 1's content, as a save does (D12
    # decision 12, Preflight ruling 7). Anchored on exactly that path, a
    # trailing slash or not: the list (GET, the same path) matches too and
    # has no body; the configuration's own paths (.../configurations/:id, its
    # rename and delete) don't, and keep 1 MiB. Its error log crit and worse
    # only (D36-1 decision 41): the list's query is the search text, which an
    # upstream's failure would quote.
    location ~ ^/api/v1/organizations/[^/]+/configurations/?$ {
        client_max_body_size 5m;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_platform;
    }

    # A version's validation (POST .../versions/:versionId/validation, D13b
    # decision 12): 2 MiB, the route's own bodyLimit. The body carries the
    # YAML, 262,144 characters, up to 1.5 MiB once JSON escapes them, and
    # nothing else of size.
    location ~ ^/api/v1/organizations/[^/]+/configurations/[^/]+/versions/[^/]+/validation$ {
        client_max_body_size 2m;
        proxy_pass http://telflo_platform;
    }

    # A test file's upload (POST .../test-files) and a pasted sample (POST
    # .../test-files/samples), D14a decision 16 and Preflight ruling 10:
    # 11 MiB, a 10 MiB file and its multipart framing (the parts' headers,
    # a 200-character name and a 2,000-character description). The API
    # reads the body only after the session's check, streams it to the file
    # store and refuses past 10 MiB (1 MiB for a sample) itself. The list
    # (GET .../test-files) matches too and has no body; a file's delete
    # (.../test-files/:id) doesn't, and keeps 1 MiB.
    location ~ ^/api/v1/organizations/[^/]+/test-files(/samples)?$ {
        client_max_body_size 11m;
        proxy_pass http://telflo_platform;
    }

    # A test template's upload (POST /api/v1/test-templates, D14b detail 21
    # and Preflight ruling 11), a product admin's: 11 MiB, as a test file's
    # upload above, a 10 MiB file and its multipart framing (the parts'
    # headers, a 200-character name, a 2,000-character description, the
    # receiver type and the signal). The API reads the body only after the
    # session's and the product-admin flag's checks, streams it to the file
    # store and refuses past 10 MiB itself. The list (GET, the same path)
    # matches too and has no body; a template's change, delete and file reads
    # (/api/v1/test-templates/:id...) don't, and keep 1 MiB.
    location ~ ^/api/v1/test-templates$ {
        client_max_body_size 11m;
        proxy_pass http://telflo_platform;
    }

    # Queuing a test run (POST .../versions/:versionId/test-runs, D14a
    # decision 28): 2 MiB, the route's own bodyLimit. The body carries the
    # YAML, 262,144 characters, up to 1.5 MiB once JSON escapes them, as a
    # validation's, and nothing else of size. The run list (GET, the same
    # path) matches too and has no body; a run's read and its files'
    # (.../test-runs/:id...) don't, and keep 1 MiB.
    location ~ ^/api/v1/organizations/[^/]+/configurations/[^/]+/versions/[^/]+/test-runs$ {
        client_max_body_size 2m;
        proxy_pass http://telflo_platform;
    }

    # A flow's create (POST /api/v1/flows) and change (PATCH
    # /api/v1/flows/:id), D12 decision 11: 4 MiB, the routes' own bodyLimit.
    # The body carries the YAML and the description, 262,144 characters
    # each, up to 1.5 MiB each once JSON escapes them. The reads and the
    # delete match too and have no body.
    location ~ ^/api/v1/flows(/[^/]+)?$ {
        client_max_body_size 4m;
        proxy_pass http://telflo_platform;
    }

    # An organization's create (POST /api/v1/organizations) and change
    # (PATCH /api/v1/organizations/:organizationId) with its logo, D23-2
    # decisions 33 and 49: 3 MiB, a 2 MiB logo and its multipart framing
    # (the two parts' headers and a 100-character name, at most 400 bytes).
    # The API reads the body only after the session's check (and, for a
    # change, the organization's and the role's), and refuses a logo past
    # 2 MiB itself. The delete matches too and has no body; every longer
    # organization path (its settings, members, invitations,
    # configurations...) doesn't, and keeps 1 MiB or its own above.
    location ~ ^/api/v1/organizations(/[^/]+)?$ {
        client_max_body_size 3m;
        proxy_pass http://telflo_platform;
    }

    # A library file's upload (POST /api/v1/library-files, D23-2 decisions 43
    # and 49), a product admin's: 11 MiB, as a test template's above, a 10
    # MiB file and its multipart framing (the parts' headers, a 200-character
    # name and a 2,000-character description). The API reads the body only
    # after the session's and the product-admin flag's checks, and refuses
    # past 10 MiB itself. The list (GET, the same path) matches too and has
    # no body; a file's change, delete, bytes and link
    # (/api/v1/library-files/:id...) don't, and keep 1 MiB.
    location ~ ^/api/v1/library-files$ {
        client_max_body_size 11m;
        proxy_pass http://telflo_platform;
    }

    # The public surface's writes with a body (D25 decision 46, Preflight
    # rulings 17 and 21): 2 MiB, the routes' own bodyLimit, for a
    # configuration's create (POST /api/public/v1/configurations), a
    # version's append (POST .../configurations/:id/versions) and change
    # (PATCH .../versions/:versionNumber), /validate and /ottl/lint: the
    # YAML, 262,144 characters, up to 1.5 MiB once JSON escapes them (the
    # public surface carries no graph). The lists and reads match too and
    # have no body; every other public path keeps 1 MiB. Case-sensitive, as
    # location /api/ is. After the library's location, before location /.
    location ~ ^/api/public/v1/(configurations(/[^/]+/versions(/[^/]+)?)?|validate|ottl/lint)$ {
        client_max_body_size 2m;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_platform;
    }

    # A test run's queue (POST /api/public/v1/test-runs, D25 decisions 40
    # and 46, Preflight ruling 17): 8 MiB, the route's own bodyLimit: a 1
    # MiB sample, which JSON escaping can grow up to six times, beside the
    # YAML and inline rules. The API checks the decoded sample against 1
    # MiB itself. The list (GET, the same path) matches too and has no body;
    # a run's read and output (/test-runs/:id...) keep 1 MiB.
    location ~ ^/api/public/v1/test-runs$ {
        client_max_body_size 8m;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_platform;
    }

    # Every other path under the public surface (D25 Ruling 184): to the API
    # as location /api/ sends it (the server's 1 MiB and proxy headers), its
    # error log crit and worse only, as the quick-deploy and library-link
    # locations: nginx's error log quotes the request line (a pipeline's
    # name in route 14's path, a query) for an upstream's failure and for a
    # body over the limit, and its format can't be changed. Matched on the
    # path as nginx routes it ($uri, decoded once, "//" merged, dot segments
    # resolved), case aside, the prefix's characters encoded again or not
    # (a doubly encoded spelling nginx decodes once), any path between its
    # three words (a dot segment encoded twice, which the API resolves),
    # only slashes and dots before it: so it holds the spellings of the
    # API's public surface (http/public-path.ts) that would otherwise reach
    # location /api/ (or location /). Mixed case goes to the API here (it
    # reads them as public; location /api/ matches case). The two locations
    # above, for the larger bodies, log the same way. An accepted residue
    # (Ruling 187): an /api/v1 size location above, matched first, can be
    # made to climb into the prefix by a request crafted with a doubly
    # encoded parameter (a dot segment the API decodes again), its error
    # log at the image's level (error), so an upstream's failure quotes its
    # line: the caller's own text only, never a route 14 pipeline's name,
    # and the API still answers it the one 401.
    location ~* ^((/|%(25)*2f)(\.|%(25)*2e)*)+(a|%(25)*[46]1)(p|%(25)*[57]0)(i|%(25)*[46]9)(/|%(25)*2f)([^?]*(/|%(25)*2f))?(p|%(25)*[57]0)(u|%(25)*[57]5)(b|%(25)*[46]2)(l|%(25)*[46]c)(i|%(25)*[46]9)(c|%(25)*[46]3)(/|%(25)*2f)([^?]*(/|%(25)*2f))?(v|%(25)*[57]6)(1|%(25)*31)(/|%(25)*2f|$) {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://telflo_platform;
    }

    location / {
        proxy_pass http://telflo_web;
    }
}
