# otelcol-testing-forward (D14a Preflight rulings 4 and 21): the
# collector tester sits only on an internal network, where Docker publishes
# no port, so this forwarder, on that network and the default one, passes
# TCP through to it for the API run natively in development and for the
# smoke test. Compose publishes it on the host's 127.0.0.1 only. The API in
# compose calls the tester directly, never through here.
#
# A stream (TCP) proxy, not HTTP: it reads nothing of a request, the Bearer
# secret included. The tester's name is resolved by Docker's DNS at each
# connection (`resolver` with a variable upstream), not once at start, so the
# forwarder starts before the tester and follows it across restarts.
# proxy_timeout's default (10 minutes without a byte either way) is far above
# a run's longest silence (64 + 60 s).
events {}

stream {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 8002;
        set $t otelcol-testing:8002;
        proxy_pass $t;
    }
}
