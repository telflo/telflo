# The stack smoke collector's supervisor (D16a Preflight ruling 18): the
# capabilities a server-class fleet's collector has, never
# reports_remote_config (deprecated in 0.161, refused from 0.163). Every
# per-collector value is the container's environment (see the Dockerfile).
server:
  endpoint: ${env:TELFLO_OPAMP_ENDPOINT}
  headers:
    Authorization: "Bearer ${env:TELFLO_OPAMP_BEARER}"
    ServerName: ${env:TELFLO_COLLECTOR_NAME}
  # Plain HTTP: the smoke's agent endpoint has no TLS.
  tls:
    insecure: true
capabilities:
  reports_effective_config: true
  reports_health: true
  accepts_remote_config: true
  accepts_opamp_connection_settings: true
  reports_own_metrics: false
  reports_own_logs: false
  reports_own_traces: false
agent:
  executable: /usr/local/bin/otelcol-contrib
  config_files:
    - /etc/telflo-smoke/local.yaml
  description:
    non_identifying_attributes:
      telflo.collector_group_id: ${env:TELFLO_COLLECTOR_GROUP_ID}
storage:
  directory: /home/opampsupervisor/storage
