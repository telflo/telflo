{{- include "telflo.guards" . }}
{{- $web := .Values.web }}
{{- $name := include "telflo.webName" . }}
{{- /*
The web app (D33-1 decisions 13, 18 and 25; Preflight rulings 7 and 9; the
plan's Appendix): the image's own server (node server.mjs), which logs no
request. It holds no credential: it calls the API inside the cluster and
renders the public origin's links. Its root stays read-only; it writes
nothing.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "telflo.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "telflo.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "telflo.labels" (dict "ctx" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ int $web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "telflo.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "telflo.labels" (dict "ctx" . "component" "web") | nindent 8 }}
      {{- with $web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "telflo.podBasics" . | nindent 6 }}
      securityContext:
        # 1000, the image's node user.
        {{- include "telflo.podSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      containers:
        # The image's own command (node server.mjs) and its PORT (3000) and
        # NODE_ENV (production).
        - name: web
          image: {{ include "telflo.image" (list . "web") | quote }}
          imagePullPolicy: {{ include "telflo.pullPolicy" (list . "web") | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TELFLO_API_INTERNAL_URL
              value: {{ include "telflo.apiInternalUrl" . | quote }}
            # Canonical URLs.
            - name: TELFLO_PUBLIC_WEB_URL
              value: {{ include "telflo.envLiteral" .Values.publicUrl }}
            {{- /* The site's switches and links, as the API's (D36-1 decision 27). */}}
            {{- include "telflo.siteEnv" . | nindent 12 }}
            {{- /* Product analytics: a project's public key, never a secret. Empty: none, and no cookie banner. */}}
            {{- with $web.posthog.key }}
            - name: TELFLO_POSTHOG_KEY
              value: {{ include "telflo.envLiteral" . }}
            {{- end }}
            {{- with $web.posthog.host }}
            - name: TELFLO_POSTHOG_HOST
              value: {{ include "telflo.envLiteral" . }}
            {{- end }}
          # A static file the server answers before its request handler: no
          # log line and no call to the API (decision 18).
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with $web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "telflo.containerSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 12 }}
      {{- include "telflo.scheduling" (list . "web") | nindent 6 }}
