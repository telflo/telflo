{{- include "telflo.guards" . }}
{{- $g := .Values.gateway }}
{{- $svc := $g.service }}
{{- $name := include "telflo.gatewayName" . }}
{{- $conf := .Files.Get "files/gateway-default.conf" }}
{{- if not $conf }}{{ fail "files/gateway-default.conf is missing from the chart" }}{{ end }}
{{- $extraRoutes := include "telflo.gatewayExtraRoutes" . }}
{{- /*
The gateway (D33-1 decisions 6, 16, 17 and 25; Preflight ruling 6): nginx
with docker/gateway/default.conf, byte for byte (files/gateway-default.conf
is its copy; Helm can't read outside the chart, and a render test holds the
two equal). It routes every request to telflo-web:3000 and telflo-api:8080,
the Services the platform's other templates name so, and is the one origin
browsers reach (no Ingress).

nginx runs as its image's user, uid and gid 101, with a read-only root:
the pod's safe sysctl net.ipv4.ip_unprivileged_port_start=80 lets it bind
port 80 (Kubernetes 1.22 or later), and it writes only to emptyDirs at
/var/cache/nginx and /run. Its probes are TCP: no request, no log line.

default.conf includes /etc/nginx/telflo/extra-routes.conf (D36-1 decision
24, Preflight ruling 15): gateway.extraRoutes rendered as nginx locations
(telflo.gatewayExtraRoutes), in a second ConfigMap,
telflo-gateway-extra-routes, an empty file when the list is empty (nginx
won't start without the file).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "telflo.labels" (dict "ctx" . "component" "gateway") | nindent 4 }}
data:
  default.conf: |
    {{- $conf | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-extra-routes" $name | quote }}
  labels:
    {{- include "telflo.labels" (dict "ctx" . "component" "gateway") | nindent 4 }}
data:
  {{- if $extraRoutes }}
  extra-routes.conf: |
    {{- trimSuffix "\n" $extraRoutes | nindent 4 }}
  {{- else }}
  extra-routes.conf: ""
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "telflo.labels" (dict "ctx" . "component" "gateway") | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # LoadBalancer unless given: a null type never becomes ClusterIP.
  type: {{ default "LoadBalancer" $svc.type | quote }}
  {{- with $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . | quote }}
  {{- end }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "telflo.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "telflo.labels" (dict "ctx" . "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ int $g.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "telflo.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "telflo.labels" (dict "ctx" . "component" "gateway") | nindent 8 }}
      annotations:
        # A changed configuration rolls the pods (its files are mounted by
        # subPath, which never updates in place).
        checksum/gateway-config: {{ $conf | sha256sum | quote }}
        checksum/gateway-extra-routes: {{ $extraRoutes | sha256sum | quote }}
        {{- with $g.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "telflo.podBasics" . | nindent 6 }}
      securityContext:
        # 101, the nginx image's nginx user and group.
        {{- include "telflo.podSecurityContext" (dict "uid" 101 "gid" 101 "sysctls" (list (dict "name" "net.ipv4.ip_unprivileged_port_start" "value" "80"))) | nindent 8 }}
      containers:
        - name: nginx
          image: {{ include "telflo.image" (list . "gateway") | quote }}
          imagePullPolicy: {{ include "telflo.pullPolicy" (list . "gateway") | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # default.conf's include (outside conf.d/: nginx reads only
            # what it names).
            - name: extra-routes
              mountPath: /etc/nginx/telflo/extra-routes.conf
              subPath: extra-routes.conf
              readOnly: true
            # Its temporary files (request bodies, proxied replies) and its
            # pid file (/var/run is /run in the image).
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
          {{- with $g.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "telflo.containerSecurityContext" (dict "uid" 101 "gid" 101) | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $name | quote }}
            items:
              - key: default.conf
                path: default.conf
                mode: 0444
        - name: extra-routes
          configMap:
            name: {{ printf "%s-extra-routes" $name | quote }}
            items:
              - key: extra-routes.conf
                path: extra-routes.conf
                mode: 0444
        # Request bodies (up to default.conf's largest
        # client_max_body_size, 11m) and proxied replies spill here. No
        # sizeLimit (Ruling 337): nginx buffers unauthenticated bodies here,
        # so a limit would let a couple of dozen slow clients fill it, and
        # the kubelet would then evict the pod (the only gateway, by
        # default): an outage anyone can repeat. Without one the outage
        # remains, only later: under the node's DiskPressure the kubelet
        # evicts before the disk is full, and picks this pod first (no
        # ephemeral-storage request, the largest emptyDir), after gigabytes
        # of uploads in flight rather than 256Mi. Never set an
        # ephemeral-storage limit on the gateway: it brings the per-pod
        # eviction back. The real mitigation is a default.conf change
        # (smaller or unbuffered unauthenticated bodies), D33-2's
        # (security.md).
        - name: cache
          emptyDir: {}
        # The pid file only.
        - name: run
          emptyDir:
            sizeLimit: 1Mi
      {{- include "telflo.scheduling" (list . "gateway") | nindent 6 }}
