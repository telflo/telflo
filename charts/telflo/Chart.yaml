apiVersion: v2
name: telflo
description: The Telflo platform on Kubernetes - the API, the web app, the gateway, the collector validator and tester, the OTTL evaluator and one shared Postgres - with the opamp-server chart as a dependency.
type: application
# The chart's version and appVersion are the platform release's, always the
# same version, which is also every platform image's tag. A published
# version is never overwritten.
version: 0.2.1
appVersion: "0.2.1"
# 1.22 or later: the gateway's pod sets the sysctl
# net.ipv4.ip_unprivileged_port_start, on the safe list from 1.22. The
# opamp-server chart needs 1.25.
kubeVersion: ">=1.25.0-0"
home: https://github.com/telflo/telflo
sources:
  - https://github.com/telflo/telflo
keywords:
  - opentelemetry
  - collector
  - opamp
# The opamp-server chart, vendored unpacked under charts/opamp-server:
# a copy of the opamp-server repository's charts/opamp-server at the tag
# vendor/opamp-server/PIN names, byte for byte, its git tree id the PIN's
# chart-tree (scripts/check-opamp-server-pin.sh holds the three equal). So
# rendering, linting and packaging need no registry. There is no Chart.lock:
# never run `helm dependency update` or `build` here.
dependencies:
  - name: opamp-server
    version: 0.3.0
    repository: oci://ghcr.io/telflo/charts
