# A hosted install's site values (D36-1 decision 27): open registration, the
# playground and the anonymous reads on, the Terms asked with their URLs,
# the sales inquiries on with their address, Settings › Notifications on
# (Q270); mail over implicit TLS with a login and a private CA; and the
# marketing site's / and /home/ through
# gateway.extraRoutes (decision 24: tests/expected/extra-routes.conf).
publicUrl: https://telflo.example.com
site:
  registration: open
  playground: true
  anonymousValidate: true
  publicFlows: true
  salesInquiry: true
  emailNotifications: true
  docsUrl: "https://docs.example.com/telflo/"
  terms:
    version: "2026-01-01"
    termsUrl: /home/terms-of-service
    privacyUrl: /home/privacy-policy
    cookiePolicyUrl: https://telflo.example.com/home/cookie-policy
api:
  salesInquiryTo: sales@telflo.example.com
  mail:
    from: noreply@telflo.example.com
    smtp:
      host: smtp.example.com
      port: 465
      tls: implicit
      auth: true
      caSecret: example-smtp-ca
opamp-server:
  server:
    publicUrl: https://opamp.example.com/opamp/api/v1
gateway:
  extraRoutes:
    - path: /
      match: exact
      service: telflo-site
      port: 8081
    - path: /home/
      match: prefix
      service: telflo-site
      port: 8081
