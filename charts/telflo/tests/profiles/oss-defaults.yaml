# The default profile with the site block written out at the values'
# defaults: the open source's. It renders exactly as the default profile
# does.
publicUrl: https://telflo.example.com
site:
  registration: invite-only
  playground: false
  anonymousValidate: false
  publicFlows: false
  salesInquiry: false
  emailNotifications: false
  userFeedback: false
  learning: false
  userAdmin: false
  docsUrl: "https://docs.telflo.com/"
  terms:
    version: ""
    termsUrl: ""
    privacyUrl: ""
    cookiePolicyUrl: ""
api:
