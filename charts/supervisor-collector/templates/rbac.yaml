{{- if or (eq .Values.role "node") (eq .Values.role "cluster") -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tsc.fullname" . | quote }}
rules:
{{- if eq .Values.role "node" }}
{{- /*
kubeletstats: nodes/stats for /stats/summary; nodes/pods for /pods
(extra_metadata_labels, the request and limit utilization metrics), which a
kubelet with fine-grained authorization (Kubernetes 1.33+) checks first.
nodes/proxy is every other kubelet path, exec, attach and port-forward
included: only with kubeletProxy, for /pods on an older kubelet.
*/}}
  - apiGroups: [""]
    resources: ["nodes/stats", "nodes/pods"{{ if .Values.kubeletProxy }}, "nodes/proxy"{{ end }}]
    verbs: ["get"]
{{- else }}
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "events", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tsc.fullname" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tsc.fullname" . | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tsc.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- end -}}
