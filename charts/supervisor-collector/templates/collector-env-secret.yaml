{{- if .Values.collectorEnv }}
# Holds the operator's collectorEnv values (config ${env:NAME} references).
# Delivered to the collector container via envFrom (see tsc.collectorEnvFrom)
# instead of inline env values, so the values are readable only with Secret
# RBAC — `kubectl describe pod` shows the Secret's name, not its contents.
# Each key is quoted: a variable named by a YAML 1.1 word (ON, yes, null, ~)
# stays that name instead of becoming true, false or a parse error.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-collector-env" (include "tsc.fullname" .) | quote }}
type: Opaque
stringData:
{{- range $name, $value := .Values.collectorEnv }}
  {{ $name | quote }}: {{ $value | quote }}
{{- end }}
{{- end }}
