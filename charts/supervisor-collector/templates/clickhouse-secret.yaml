{{- if and .Values.clickhouse.endpoint .Values.clickhouse.password (not .Values.clickhouse.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-clickhouse" (include "tsc.fullname" .) | quote }}
type: Opaque
stringData:
  {{ .Values.clickhouse.passwordKey | default "CLICKHOUSE_PASSWORD" }}: {{ .Values.clickhouse.password | quote }}
{{- end }}
