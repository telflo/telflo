# Telflo on one machine with Docker Compose: the same images, settings and
# defaults as the Helm chart (charts/telflo), for trying Telflo or running
# it for a team on one host.
#
#   ./setup.sh --public-url <origin> --agent-url <origin> --mailpit   (./setup.sh --help)
#   docker compose up -d
#   docker compose exec -T api telflo-admin bootstrap --email <you> --organization <name>
#
# setup.sh writes .env (mode 0600: every setting below, and every secret
# but three) and secrets/ (mode 0700: the three secrets the services read
# only from files). Nothing here holds a value of its own: a required
# setting missing from .env stops `docker compose up` with its name. The
# README's Quick start walks through it; docs/compose.md covers TLS in
# front, a real mail relay, upgrades and backups.
#
# What it runs: Postgres (both databases, telflo_platform and telflo_opamp_server, in the
# volume db-data), the opamp-server (the agent endpoint, where
# collectors poll), the API with its migrations (its files in the volume
# file-store), the web app, the collector validator, the collector
# tester and the OTTL evaluator (each locked down on its own network), the
# gateway (the one origin browsers reach), and, under the profile mailpit
# (setup.sh --mailpit), Mailpit, for trying Telflo without a mail relay.
#
# Only two ports are published, both on TELFLO_BIND_ADDRESS (127.0.0.1
# unless setup.sh --bind said otherwise): the gateway (plain http, put your
# own TLS in front) and the agent endpoint. Mailpit's inbox is on
# 127.0.0.1 only. The opamp-server's management API, the database and the
# internal services are never published.
#
# The Telflo images are named by tag, the release's version, under
# TELFLO_IMAGE_REGISTRY: ghcr.io/telflo/telflo when it is unset or empty,
# or a mirror's path holding the same <name>:<version> (docs/compose.md).
# Postgres, nginx, Mailpit and the opamp-server are named by digest (the
# chart's pins), from their own registries whatever it says. Migrations
# run on every start: an upgrade is the new release's folder with this
# one's .env and secrets/, then `docker compose pull` and `docker compose
# up -d`.

# A fixed project name, so the volumes keep their names when a new release
# is unpacked into another folder (the development stack is telflo-dev).
name: telflo

# The API's settings: fixed wiring here, everything else from .env.
x-telflo-api-environment: &telflo-api-environment
  # The API's own login role, made by migrate (row-level security
  # constrains it). Only migrate knows the owner's password.
  TELFLO_DATABASE_URL: "postgresql://telflo_platform:${TELFLO_API_PASSWORD:?run ./setup.sh first}@db:5432/telflo_platform"
  TELFLO_API_PORT: "8080"
  TELFLO_PUBLIC_WEB_URL: "${TELFLO_PUBLIC_WEB_URL:?run ./setup.sh first}"
  TELFLO_PUBLIC_API_URL: "${TELFLO_PUBLIC_API_URL:?run ./setup.sh first}"
  TELFLO_COOKIE_SECURE: "${TELFLO_COOKIE_SECURE:?run ./setup.sh first}"
  TELFLO_TRUST_PROXY_HOPS: "${TELFLO_TRUST_PROXY_HOPS:?run ./setup.sh first}"
  TELFLO_ACCESS_TOKEN_SECRET: "${TELFLO_ACCESS_TOKEN_SECRET:?run ./setup.sh first}"
  TELFLO_VERIFICATION_TOKEN_TTL_HOURS: "24"
  # Mail: Mailpit (setup.sh --mailpit) or a real relay.
  TELFLO_MAIL_TRANSPORT: "${TELFLO_MAIL_TRANSPORT:?run ./setup.sh first}"
  TELFLO_MAIL_FROM: "${TELFLO_MAIL_FROM:?run ./setup.sh first}"
  TELFLO_SMTP_HOST: "${TELFLO_SMTP_HOST:-}"
  TELFLO_SMTP_PORT: "${TELFLO_SMTP_PORT:-}"
  TELFLO_SMTP_TLS: "${TELFLO_SMTP_TLS:-}"
  TELFLO_SMTP_ALLOW_INSECURE: "${TELFLO_SMTP_ALLOW_INSECURE:-false}"
  TELFLO_SMTP_USERNAME: "${TELFLO_SMTP_USERNAME:-}"
  TELFLO_SMTP_PASSWORD: "${TELFLO_SMTP_PASSWORD:-}"
  TELFLO_SENDGRID_API_KEY: "${TELFLO_SENDGRID_API_KEY:-}"
  # Sign in with Google: optional, both or neither.
  TELFLO_OIDC_GOOGLE_CLIENT_ID: "${TELFLO_OIDC_GOOGLE_CLIENT_ID:-}"
  TELFLO_OIDC_GOOGLE_CLIENT_SECRET: "${TELFLO_OIDC_GOOGLE_CLIENT_SECRET:-}"
  # The site's switches and links, the same on web (setup.sh writes
  # the open source's defaults). TELFLO_DOCS_URL without the colon: set
  # empty, it hides the docs links.
  TELFLO_REGISTRATION: "${TELFLO_REGISTRATION:-invite-only}"
  TELFLO_PLAYGROUND: "${TELFLO_PLAYGROUND:-false}"
  TELFLO_ANONYMOUS_VALIDATE: "${TELFLO_ANONYMOUS_VALIDATE:-false}"
  TELFLO_PUBLIC_FLOWS: "${TELFLO_PUBLIC_FLOWS:-false}"
  TELFLO_SALES_INQUIRY: "${TELFLO_SALES_INQUIRY:-false}"
  TELFLO_SALES_INQUIRY_TO: "${TELFLO_SALES_INQUIRY_TO:-}"
  TELFLO_EMAIL_NOTIFICATIONS: "${TELFLO_EMAIL_NOTIFICATIONS:-false}"
  TELFLO_DOCS_URL: "${TELFLO_DOCS_URL-https://docs.telflo.com/}"
  TELFLO_TERMS_VERSION: "${TELFLO_TERMS_VERSION:-}"
  TELFLO_TERMS_URL: "${TELFLO_TERMS_URL:-}"
  TELFLO_PRIVACY_URL: "${TELFLO_PRIVACY_URL:-}"
  TELFLO_COOKIE_POLICY_URL: "${TELFLO_COOKIE_POLICY_URL:-}"
  # The opamp-server: its management API over this project's network, and
  # the agent endpoint's public URL the API hands every collector (the same
  # value as the server's own OPAMP_SERVER_URL).
  TELFLO_OPAMP_MANAGEMENT_URL: http://opamp-server:51235
  TELFLO_OPAMP_MANAGEMENT_SECRET: "${TELFLO_OPAMP_MANAGEMENT_SECRET:?run ./setup.sh first}"
  TELFLO_OPAMP_AGENT_PUBLIC_URL: "${TELFLO_OPAMP_AGENT_PUBLIC_URL:?run ./setup.sh first}"
  TELFLO_OPAMP_ALLOW_INSECURE_CONNECTIONS: "${TELFLO_OPAMP_ALLOW_INSECURE_CONNECTIONS:?run ./setup.sh first}"
  # The validator, the tester and the evaluator, each with its shared
  # secret (the tester's and the evaluator's are also their files in
  # secrets/: the same values).
  TELFLO_OTELCOL_VALIDATOR_URL: http://otelcol-validator:8001
  TELFLO_OTELCOL_VALIDATOR_SECRET: "${TELFLO_OTELCOL_VALIDATOR_SECRET:?run ./setup.sh first}"
  TELFLO_OTELCOL_TESTING_URL: http://otelcol-testing:8002
  TELFLO_OTELCOL_TESTING_SECRET: "${TELFLO_OTELCOL_TESTING_SECRET:?run ./setup.sh first}"
  TELFLO_OTTL_EVALUATOR_URL: http://ottl-evaluator:8003
  TELFLO_OTTL_EVALUATOR_SECRET: "${TELFLO_OTTL_EVALUATOR_SECRET:?run ./setup.sh first}"
  # The file store: the volume file-store by default; S3 when .env
  # sets TELFLO_FILE_STORE=s3 and the bucket's settings (docs/configuration.md).
  TELFLO_FILE_STORE: "${TELFLO_FILE_STORE:-local}"
  TELFLO_FILE_STORE_ROOT: /var/lib/telflo/file-store
  TELFLO_FILE_STORE_BUCKET: "${TELFLO_FILE_STORE_BUCKET:-}"
  TELFLO_FILE_STORE_PREFIX: "${TELFLO_FILE_STORE_PREFIX:-}"
  TELFLO_FILE_STORE_S3_REGION: "${TELFLO_FILE_STORE_S3_REGION:-}"
  TELFLO_FILE_STORE_S3_ENDPOINT: "${TELFLO_FILE_STORE_S3_ENDPOINT:-}"
  TELFLO_FILE_STORE_S3_FORCE_PATH_STYLE: "${TELFLO_FILE_STORE_S3_FORCE_PATH_STYLE:-false}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
  AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
  # Quick-deploy links and the library's Copy curl links: their keys.
  TELFLO_QUICK_DEPLOY_ENCRYPTION_KEY: "${TELFLO_QUICK_DEPLOY_ENCRYPTION_KEY:?run ./setup.sh first}"
  TELFLO_QUICK_DEPLOY_PREVIOUS_ENCRYPTION_KEYS: "${TELFLO_QUICK_DEPLOY_PREVIOUS_ENCRYPTION_KEYS:-}"
  TELFLO_LIBRARY_LINK_SIGNING_KEY: "${TELFLO_LIBRARY_LINK_SIGNING_KEY:?run ./setup.sh first}"
  TELFLO_LIBRARY_LINK_SIGNING_KEYS_PREVIOUS: "${TELFLO_LIBRARY_LINK_SIGNING_KEYS_PREVIOUS:-}"

services:
  # One Postgres for both databases. Its superuser, postgres, runs only the
  # bootstrap below; the platform's owner (telflo_platform_owner) and the opamp-server's
  # roles are made by it.
  db:
    image: postgres:18@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${TELFLO_POSTGRES_PASSWORD:?run ./setup.sh first}"
    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker.
      - db-data:/var/lib/postgresql
    # Over TCP: while the image creates its data its temporary server
    # listens on a Unix socket only.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot, on every start: the chart's two bootstraps, as the superuser.
  # postgres/telflo-bootstrap.sql makes the platform's owner, telflo_platform_owner (no
  # superuser), and its database; opamp-server/bootstrap.sql the
  # opamp-server's three roles and its database. Both are idempotent: a
  # rerun creates nothing that exists and sets the passwords again. The
  # passwords reach psql only through its environment (\getenv), never its
  # command line; log_min_error_statement=panic keeps a failing statement,
  # password and all, out of Postgres's log.
  db-bootstrap:
    image: postgres:18@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    command: ["psql", "-h", "db", "-U", "postgres", "-d", "postgres", "-X", "-q", "-v", "ON_ERROR_STOP=1", "-f", "/telflo/telflo-bootstrap.sql", "-f", "/opamp/bootstrap.sql"]
    environment:
      PGPASSWORD: "${TELFLO_POSTGRES_PASSWORD:?run ./setup.sh first}"
      PGOPTIONS: "-c log_min_error_statement=panic"
      TELFLO_OWNER_PASSWORD: "${TELFLO_OWNER_PASSWORD:?run ./setup.sh first}"
      OPAMP_OWNER_PASSWORD: "${TELFLO_OPAMP_OWNER_PASSWORD:?run ./setup.sh first}"
      OPAMP_RUNTIME_PASSWORD: "${TELFLO_OPAMP_RUNTIME_PASSWORD:?run ./setup.sh first}"
    volumes:
      - ./postgres/telflo-bootstrap.sql:/telflo/telflo-bootstrap.sql:ro
      - ./opamp-server/bootstrap.sql:/opamp/bootstrap.sql:ro
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # One-shot, on every start: the platform's migrations as its owner, then
  # the API's login role. A no-op when the schema is current.
  migrate:
    image: "${TELFLO_IMAGE_REGISTRY:-ghcr.io/telflo/telflo}/api:0.2.1"
    working_dir: /app/packages/db
    command: ["node", "dist/migrate.js"]
    environment:
      TELFLO_MIGRATION_DATABASE_URL: "postgresql://telflo_platform_owner:${TELFLO_OWNER_PASSWORD:?run ./setup.sh first}@db:5432/telflo_platform"
      TELFLO_DATABASE_URL: "postgresql://telflo_platform:${TELFLO_API_PASSWORD:?run ./setup.sh first}@db:5432/telflo_platform"
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
    restart: "no"

  # One-shot, on every start: the opamp-server's migrations, as its schema's
  # owner. serve refuses a schema that isn't exactly current.
  opamp-migrate:
    image: ghcr.io/telflo/opamp-server:0.3.0@sha256:525595dc26a5d601aed05a763475de9614fa11b44b5152d63c75086a7835ce5f
    command: ["migrate", "up"]
    environment:
      OPAMP_MIGRATION_DATABASE_URL: "postgresql://telflo_opamp_server_owner:${TELFLO_OPAMP_OWNER_PASSWORD:?run ./setup.sh first}@db:5432/telflo_opamp_server"
    depends_on:
      db-bootstrap: { condition: service_completed_successfully }
    restart: "no"

  # The opamp-server: its management API (for the API only, never
  # published) and the agent endpoint, where collectors poll with an
  # enrollment token's bearer. OPAMP_SERVER_URL is the URL collectors are
  # handed: setup.sh's --agent-url. The bearers' encryption key is a file
  # (secrets/opamp-encryption-key), never in the environment: back it up
  # with .env, the stored tokens can't be read without it.
  opamp-server:
    image: ghcr.io/telflo/opamp-server:0.3.0@sha256:525595dc26a5d601aed05a763475de9614fa11b44b5152d63c75086a7835ce5f
    command: ["serve"]
    # Drains for 5 s, then up to 22 s more for requests and telemetry.
    stop_grace_period: 30s
    environment:
      OPAMP_DATABASE_URL: "postgresql://telflo_opamp_server:${TELFLO_OPAMP_RUNTIME_PASSWORD:?run ./setup.sh first}@db:5432/telflo_opamp_server"
      OPAMP_MANAGEMENT_SECRET: "${TELFLO_OPAMP_MANAGEMENT_SECRET:?run ./setup.sh first}"
      OPAMP_ENCRYPTION_KEY_FILE: /run/secrets/opamp_encryption_key
      OPAMP_SERVER_URL: "${OPAMP_SERVER_URL:?run ./setup.sh first}"
    secrets: [opamp_encryption_key]
    ports:
      - "${TELFLO_BIND_ADDRESS:?run ./setup.sh first}:${TELFLO_AGENT_PORT:?run ./setup.sh first}:51234"
    depends_on:
      opamp-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app/opamp-server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The collector validator: checks a configuration with otelcol-contrib's
  # own validate. The API is its only caller. It reads its secret from its
  # environment.
  otelcol-validator:
    image: "${TELFLO_IMAGE_REGISTRY:-ghcr.io/telflo/telflo}/otelcol-validator:0.2.1"
    environment:
      OTELCOL_VALIDATOR_SECRET: "${TELFLO_OTELCOL_VALIDATOR_SECRET:?run ./setup.sh first}"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).status != 200)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The collector tester: runs a test of a configuration in a sandbox, on
  # its own network with no way out, a read-only root, no capabilities, its
  # secret only from a file. The API is its only caller.
  otelcol-testing:
    image: "${TELFLO_IMAGE_REGISTRY:-ghcr.io/telflo/telflo}/otelcol-testing:0.2.1"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/otelcol-testing:size=512m,uid=10001,gid=10001,mode=0700
    environment:
      OTELCOL_TESTING_SECRET_FILE: /run/secrets/otelcol_testing_secret
    secrets: [otelcol_testing_secret]
    networks: [otelcol-testing]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8002/testing/v1/health', timeout=4).status != 200)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # The OTTL evaluator: checks a test run's rules, locked down as the
  # tester, on its own network (not the tester's), memory and threads
  # bounded, its secret only from a file. The API is its only caller.
  ottl-evaluator:
    image: "${TELFLO_IMAGE_REGISTRY:-ghcr.io/telflo/telflo}/ottl-evaluator:0.2.1"
    command: ["serve"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      OTTL_EVALUATOR_SECRET_FILE: /run/secrets/ottl_evaluator_secret
      GOMAXPROCS: "4"
    secrets: [ottl_evaluator_secret]
    networks: [ottl-evaluator]
    mem_limit: 3g
    pids_limit: 256
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "/app/ottl-evaluator", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The API. telflo-admin, its operator's commands, runs in this container:
  # `docker compose exec -T api telflo-admin bootstrap ...`.
  api:
    image: "${TELFLO_IMAGE_REGISTRY:-ghcr.io/telflo/telflo}/api:0.2.1"
    environment: *telflo-api-environment
    volumes:
      - file-store:/var/lib/telflo/file-store
    # telflo-api is the gateway's upstream name: its default.conf is the
    # chart's, byte for byte, which names the chart's Services.
    networks:
      default: { aliases: [telflo-api] }
      otelcol-testing: {}
      ottl-evaluator: {}
    # Not on Mailpit: it is under a profile, and a real relay has none.
    depends_on:
      migrate: { condition: service_completed_successfully }
      opamp-server: { condition: service_healthy }
      otelcol-validator: { condition: service_healthy }
      otelcol-testing: { condition: service_started }
      ottl-evaluator: { condition: service_healthy }
    healthcheck:
      # /health runs `select 1`, so healthy means the database answers too.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    image: "${TELFLO_IMAGE_REGISTRY:-ghcr.io/telflo/telflo}/web:0.2.1"
    # telflo-web is the gateway's upstream name, as telflo-api is the API's.
    networks:
      default: { aliases: [telflo-web] }
    environment:
      TELFLO_API_INTERNAL_URL: http://api:8080
      TELFLO_PUBLIC_WEB_URL: "${TELFLO_PUBLIC_WEB_URL:?run ./setup.sh first}"
      TELFLO_REGISTRATION: "${TELFLO_REGISTRATION:-invite-only}"
      TELFLO_PLAYGROUND: "${TELFLO_PLAYGROUND:-false}"
      TELFLO_ANONYMOUS_VALIDATE: "${TELFLO_ANONYMOUS_VALIDATE:-false}"
      TELFLO_PUBLIC_FLOWS: "${TELFLO_PUBLIC_FLOWS:-false}"
      TELFLO_SALES_INQUIRY: "${TELFLO_SALES_INQUIRY:-false}"
      TELFLO_EMAIL_NOTIFICATIONS: "${TELFLO_EMAIL_NOTIFICATIONS:-false}"
      TELFLO_DOCS_URL: "${TELFLO_DOCS_URL-https://docs.telflo.com/}"
      TELFLO_TERMS_VERSION: "${TELFLO_TERMS_VERSION:-}"
      TELFLO_TERMS_URL: "${TELFLO_TERMS_URL:-}"
      TELFLO_PRIVACY_URL: "${TELFLO_PRIVACY_URL:-}"
      TELFLO_COOKIE_POLICY_URL: "${TELFLO_COOKIE_POLICY_URL:-}"
      # Product analytics: empty, none (and no cookie banner).
      TELFLO_POSTHOG_KEY: "${TELFLO_POSTHOG_KEY:-}"
      TELFLO_POSTHOG_HOST: "${TELFLO_POSTHOG_HOST:-}"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The one origin browsers reach: /api/ to the API, the rest to the web
  # app (gateway/default.conf, the chart's own). Plain http: put your TLS
  # in front (docs/compose.md).
  gateway:
    image: nginx:1.30-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/extra-routes.conf:/etc/nginx/telflo/extra-routes.conf:ro
    ports:
      - "${TELFLO_BIND_ADDRESS:?run ./setup.sh first}:${TELFLO_HTTP_PORT:?run ./setup.sh first}:80"
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Mailpit, for trying Telflo only (setup.sh --mailpit): it keeps every
  # message the API sends in a web inbox instead of delivering it. Under the
  # profile mailpit (COMPOSE_PROFILES in .env), its inbox on this machine's
  # 127.0.0.1 only, never on TELFLO_BIND_ADDRESS. Moving to a real relay:
  # README.md beside this file.
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    profiles: [mailpit]
    ports:
      - "127.0.0.1:${TELFLO_MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  db-data:
  file-store:

networks:
  # Every service not listing its networks is on this one.
  default: {}
  # The tester's: the tester and the API, no way out.
  otelcol-testing:
    internal: true
  # The evaluator's: the evaluator and the API, no way out.
  ottl-evaluator:
    internal: true

# The three secrets the services read only from files, made by setup.sh.
# Each file is 0644 inside the 0700 folder secrets/: Compose ignores a
# secret's mode and owner, and the services run as their own users (65532,
# 10001), which must be able to read it.
secrets:
  opamp_encryption_key:
    file: ./secrets/opamp-encryption-key
  otelcol_testing_secret:
    file: ./secrets/otelcol-testing-secret
  ottl_evaluator_secret:
    file: ./secrets/ottl-evaluator-secret
