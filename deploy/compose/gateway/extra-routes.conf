# The gateway's extra routes: default.conf includes
# /etc/nginx/telflo/extra-routes.conf inside its server block, and the
# compose stack mounts this file there, read only. It holds no route: the
# development stack has none. The chart renders the same file from
# gateway.extraRoutes (empty by default), each entry a `location = <path>`
# or `location ^~ <path>` block logging crit and worse, proxied to
# `<service>.<namespace>.svc:<port>`; nginx reads only comments here.
